name: One-off cleanup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete releases and tags 0.1.0 - 0.1.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in 0.1.0 0.1.1 0.1.2 0.1.3 0.1.4 0.1.5 0.1.6 0.1.7; do
            gh release delete "v$v" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            git push origin ":refs/tags/v$v" || true
          done
      - name: Move tag v0.1.8 to the rewritten commit
        run: |
          git tag -f v0.1.8 3301a270f4755e456c56bd8904edfc2b8e8fbcfe
          git push -f origin refs/tags/v0.1.8
